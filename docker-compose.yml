version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./public/uploads:/var/www/html/public/uploads
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=doorhan
      - DB_USER=doorhan_user
      - DB_PASS=doorhan_pass
      - SITE_URL=http://localhost:8080
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: doorhan_db
    environment:
      - MYSQL_DATABASE=doorhan
      - MYSQL_USER=doorhan_user
      - MYSQL_PASSWORD=doorhan_pass
      - MYSQL_ROOT_PASSWORD=doorhan_root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

volumes:
  db_data:
